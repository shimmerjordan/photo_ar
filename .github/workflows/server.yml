# 唯一的一条流水线：单元测试（Python + 网页版）→ 编镜像 → 把镜像当生产环境跑一遍
# →（打 tag 时）推 GHCR。
#
# 镜像里是**两个进程**：Node 的网页版在前（唯一的监听者）、Python 的后端在
# 127.0.0.1:8965。所以 E2E 那一步同时打三种 URI：`/`（网页版）、`/admin`（反代）、
# `/v1/*`（反代）。只打 `/v1` 的话，合并这件事本身一个字都没被验证到。
#
# ════════════════════════════════════════════════════════════════════════
# 为什么是一条而不是两条
#
# 原来是 `server.yml`（每次推 main 跑测试 + 编镜像 + 起容器打接口）和
# `publish-image.yml`（打 tag 时跑测试 + 编镜像 + 推 GHCR）两条。它们**都**跑一遍
# 完整测试、**都**编一遍镜像 —— 发版时等于把同样的事做两遍。
#
# 但合并不只是省时间，它补上了一个真实的洞：`publish-image` 只 `docker build` 就
# `docker push`，**推出去的镜像从来没被跑起来看过一眼**。而「编得出来」和「起得来
# 并能对外服务」是两件事（非 root 写不了挂载进来的 /data、healthcheck 脚本路径对不上、
# EXPOSE 的端口和实际监听的不一致 —— 三样都真实发生过）。症状是在 NAS 上
# `docker compose up` 之后一直 restarting，而那时你第一反应不会是「镜像是坏的」。
#
# 合并后 publish 挂在 image 之后，所以推上去的那一版**必然**是被起来打过接口的。
#
# ## 三层各守什么
#
#   1. **单元测试** —— 逻辑回归。装的是 `pip install -e ".[dev]"`，也就是
#      **pyproject 声明的那份依赖**，顺手验证「照着 README 装能不能跑起来」。
#   2. **编镜像** —— 用与 NAS 上完全同一份 Dockerfile，守「本机能跑、镜像里缺个包」。
#   3. **起容器打接口** —— 守 build 覆盖不到的那一半，并且这是唯一验证
#      **Dockerfile 里那三个 pip 包够不够**的地方（第 1 层装的是 pyproject 那份，
#      两份清单不必也不该保持一致）。
#
# ## 运行页上那份部署说明
#
# 最后一步把「这一版怎么拿、怎么起、从哪访问」写进 Job Summary（`.github/scripts/summary.py`），
# 所以看着构建变绿的人不用再去翻仓库找 tag 和命令。它**只在冒烟过了的时候**给部署说明；
# 挂了就只说"没有可部署的东西、先看哪一步"。它声称的每条 URI 都是上面那一步真打过的，
# 那条最小 `docker run` 与上面跑通的那条是同一组必填项（`tests/test_ci_summary.py` 从这个
# 文件里抠出来做比对）—— 所以它讲不出没被验证过的话。
#
# ⚠️ `arcoreimg` 不在仓库里（ARCore SDK 里的闭源二进制、不可再分发），所以镜像里没有它，
# 入库那条路在 CI 上会回 503。这是**预期**的：E2E 只打不需要它的接口，入库那一整条的
# 覆盖在单元测试里（`fake_arcoreimg` fixture）。
#
# ## 发版
#
#   git tag v0.2.0 && git push origin v0.2.0
#   临时发一版：Actions → server → Run workflow，把 publish 勾上
#
# 第一次推完要手动做一件事：GHCR 上新建的包**默认是 private**，NAS 上
# `docker compose pull` 会 denied。仓库右侧 Packages → photo-ar-server →
# Package settings → Change visibility 改成 public（或者在 NAS 上 docker login）。
# ════════════════════════════════════════════════════════════════════════

name: server

# 没有 paths 过滤，是刻意的。
#
# 加上 `paths: [src/**, ...]` 能让只改文档的提交跳过这条流水线，但一旦同时写了
# `tags: ["v*"]`，路径过滤对 tag 推送是否生效就变成一个说不清的行为 —— 而说不清的那个
# 分支恰好是**发版**：打完 tag 却没有任何流水线跑起来，你要过一会儿才会发现镜像没更新。
# 这个仓库是公开的，Actions 分钟数不计费，所以用「每次都跑」换掉那个坑是划算的。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "同时把镜像推到 GHCR（发版用；只想跑一遍检查就留 false）"
        type: boolean
        default: false

env:
  # ghcr.io/<owner>/photo-ar-server。用 repository_owner 而不是写死用户名，
  # fork 出去的仓库不必改这个文件。
  IMAGE: ghcr.io/${{ github.repository_owner }}/photo-ar-server

jobs:
  test:
    runs-on: ubuntu-latest
    # 1000+ 个用例里有一批要跑真的 ORB + RANSAC，比纯逻辑测试慢；本机整套约 6 分钟，
    # runner 上约 10 分钟。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # 与 Dockerfile 里的 python:3.11-slim 同版本
          cache: pip

      # pyproject 里是 opencv-python（**非** headless），`import cv2` 要 libGL.so.1，
      # 而 runner 上没有。装两个系统库比改依赖轻 —— 改成 headless 会影响本机开发时
      # 那些要弹窗看图的 bench 脚本。
      - name: 装系统库
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      # 装 pyproject 声明的那一份，而不是照抄 Dockerfile 里的 pip 行。
      # 「Dockerfile 那三个包够不够」由下面 image job 跑真镜像来验。
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 测试里的 arcoreimg / ffmpeg / ffprobe 全是 conftest 造的假二进制，
      # 所以这里不需要真的装它们。
      - name: 单元测试
        run: pytest -q

  # 网页版那 100 多条零依赖测试。单独一个 job 而不是接在 test 后面：它不需要 Python、
  # 不需要 opencv、不需要装系统库，十几秒就跑完，与上面那十分钟并行。
  #
  # 只跑 `npm test`。要真浏览器的那几套（test:golden / test:e2e / test:worker）**没有**
  # 放进 CI：它们要下 headless Chrome 并跑真的 ORB + RANSAC，而它们守的是「opencv.js
  # 换版本了没」—— 那是一件手动的、罕见的事，值得手动跑一遍看数字，不值得每次推代码
  # 等三分钟。`test:smoke` / `test:pages` 要一个跑着的容器 + 一个真库，CI 上没有。
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # 与 Dockerfile 里抠出来的那个 node 同大版本
      # 没有 npm ci —— 这个包一个依赖都没有（package.json 里没有 dependencies）。
      - name: 网页版单元测试
        working-directory: web-front
        run: npm test

  image:
    runs-on: ubuntu-latest
    needs: [test, web]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # 只有 publish 那两步用得到，但权限是 job 级的
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 烧进镜像的版本号。它显示在设置页「关于」那一行（连按 7 下进调试模式的那一行），
      # 也是 `GET /api/config` 回的 `version`。
      #
      # 取值刻意与下面推出去的 tag **对得上**，这样"设置页上那串字"能直接反查到镜像：
      #   打 tag   → `v0.2.0`（git tag 名；镜像 tag 是 `0.2.0`，差一个 v）
      #   其它     → `sha-1a2b3c4`，与 `type=sha,format=short` 产出的镜像 tag 逐字符相同
      #
      # 不注入的话网页版会退回 `x.y.z-dev` —— 那个后缀的语义是"不是 CI 出的镜像"。
      # 而在这一步补上之前，**CI 出的镜像也全都写着 -dev**，于是那一行读数在真正会被
      # 部署的那些镜像里恰好是没用的。
      #
      # `REF_NAME` 走 env 而不是直接把 `${{ }}` 展开进脚本正文：tag 名是外部可控的字符串，
      # 内联展开等于把它拼进 shell 源码。这里的攻击面只对能推 tag 的人开着，但 env 这条
      # 写法一样短，没有理由留着另一条。
      - id: ver
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$IS_TAG" = "true" ]; then
            v="$REF_NAME"
          else
            v="sha-${GITHUB_SHA::7}"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "版本号 $v"

      # 只构建 linux/amd64。目标机器是 QNAP TS-464C2（Celeron N5095，x86-64）；
      # 加 arm64 会让构建时间翻倍（opencv 的 arm64 wheel 要走 QEMU 模拟），而现在没有
      # 任何 arm 机器要跑它。将来真要上 arm，改这一行。
      #
      # `load: true` 而不是 `push: true`：先把镜像装进本地 docker 跑一遍，验过了再推。
      # 这样**推上去的就是被测过的那一个镜像**（分两次 build 的话，推的那一份严格来说
      # 没被跑过）。
      #
      # 镜像里不含 arcoreimg 和 vocab.npz：前者不可再分发，后者是你自己照片训出来的
      # 数据。两个都在运行时 bind mount 送进容器（见 docker-compose.yml）。
      - name: 编镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: photo-ar-server:ci
          # Dockerfile 里这个 ARG 刻意放在所有 COPY 之后，所以它每次都变也只会让
          # 最后几行元数据失效，不会把 120MB 的 node 二进制那层顶掉。
          build-args: |
            PHOTOAR_VERSION=${{ steps.ver.outputs.value }}
          # 层缓存存在 Actions 的缓存里：不改依赖的话，opencv 那层不会重装。
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 把它当生产环境跑：非 root、/data 是 volume、healthcheck 由镜像自己带。
      #
      # 不设 PHOTOAR_TOKEN 是**刻意**的：`docker/healthcheck.py` 在没配 token 时把 401
      # 也算健康（理由在那个文件的 docstring 里），而这条路径正是默认部署走的那条 ——
      # 顺手把它验一遍。
      - name: 起容器并打接口
        id: e2e
        env:
          # 同上：不把 tag 名内联展开进脚本正文
          WANT_VERSION: ${{ steps.ver.outputs.value }}
        run: |
          set -euo pipefail
          docker volume create photoar-ci-data
          # PHOTOAR_ROOTS 是**必填**的：不给的话 entrypoint 直接拒绝启动
          # （「必须设 PHOTOAR_ROOTS（白名单根目录）」）。这一条是照着一次本地实跑
          # 加上的 —— 第一版这个 workflow 少了它，容器 2 秒就 unhealthy。
          # 名字用 ASCII：真实部署里是「照片=/share/Photo」这样的中文名，而在
          # CI 的 shell → docker → python 这条链上省掉一层编码变量。
          #
          # 除了那两个 PHOTOAR_ADMIN_*（为了下面能自动登录测一遍），**这一组必填项
          # 与 job summary 里给出的那条最小 `docker run` 是同一组** —— 也就是说那份
          # 说明是被真的跑过的。哪天多出一个必填变量，这里会先变 unhealthy。
          #
          # 刻意**没有** PHOTOAR_BIND：合并形态下它是空转的。entrypoint 把网页版的
          # HOST 写死成 0.0.0.0、把后端强制按到回环上（那条有安全含义，见
          # docker/entrypoint.py 里 backend_env 的注释），所以外面设它不改变任何事。
          # 留着会让照抄这段的人以为它是必需的。
          docker run -d --name photoar-ci \
            -e PHOTOAR_ADMIN_NAME=admin \
            -e PHOTOAR_ADMIN_PASSWORD=admin \
            -e PHOTOAR_ROOTS=photos=/data/photos,videos=/data/videos \
            -v photoar-ci-data:/data \
            -p 8964:8964 \
            photo-ar-server:ci

          # 等 healthcheck 变 healthy，而不是 sleep 一个固定秒数：镜像自己带
          # HEALTHCHECK，用它就等于顺手验证了那条命令是对的。
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Health.Status}}' photoar-ci 2>/dev/null || echo starting)
            echo "[$i] $st"
            [ "$st" = "healthy" ] && break
            if [ "$st" = "unhealthy" ] || [ "$i" = "60" ]; then
              echo "::error::容器没能变 healthy"
              docker logs photoar-ci
              exit 1
            fi
            sleep 2
          done

          # 未登录必须被拒（401），不是 200 也不是 500。
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8964/v1/ping)
          echo "未登录 /v1/ping -> $code"
          [ "$code" = "401" ] || { echo "::error::未登录的请求本该 401"; docker logs photoar-ci; exit 1; }

          # ---- 合并容器的三种 URI 都在同一个端口上 ----
          #
          # 这三条守的是「两个进程都活着、而且前面那个的路由表是对的」。少了它们，
          # 一个「Node 起不来但 Python 好好的」的镜像会全绿通过 —— 而那个镜像对宾客
          # 来说是完全不可用的（`/` 连不上），对运维却看不出问题（`/v1` 正常）。
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8964/)
          echo "网页版 / -> $code"
          [ "$code" = "200" ] || { echo "::error::网页版没起来（/ 应当是 200）"; docker logs photoar-ci; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8964/admin)
          echo "管理台 /admin -> $code"
          [ "$code" = "200" ] || { echo "::error::/admin 没被反代到后端"; docker logs photoar-ci; exit 1; }

          # 网页版自己的存活端点。它不碰上游也不碰识别库，所以它 200 而 `/` 500 的
          # 组合能把「进程活着但静态目录没拷进镜像」区分出来。
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8964/healthz)
          echo "存活探测 /healthz -> $code"
          [ "$code" = "200" ] || { echo "::error::/healthz 不对"; docker logs photoar-ci; exit 1; }

          # 版本号真的烧进去了吗。`/api/config` 不需要登录（访客也要拿阈值），所以这一句
          # 也顺带证明了"确认线上是哪一版"那条 curl 是真能用的。
          #
          # 断言而不是只打印：漏掉 build-arg 的表现是设置页上写着 `x.y.z-dev`，
          # 而那**看起来完全正常** —— 不比对就永远发现不了。（这一步加进来之前，
          # CI 出的每一个镜像都是 -dev。）
          curl -sf http://127.0.0.1:8964/api/config | tee /tmp/config.json
          python3 -c "import json,os;g=json.load(open('/tmp/config.json'))['version'];w=os.environ['WANT_VERSION'];assert g==w,f'版本号没烧进镜像：容器说 {g}，应当是 {w}';print('版本号 ok:',g)"

          # 登录 → 拿 token → 打 ping。这三步串起来就覆盖了「路由表装上了、
          # 鉴权链通了、SQLite 能写」。
          tok=$(curl -s -X POST http://127.0.0.1:8964/v1/auth/login \
                  -H 'Content-Type: application/json' \
                  -d '{"name":"admin","password":"admin"}' \
                | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          test -n "$tok" || { echo "::error::登录没拿到 token"; docker logs photoar-ci; exit 1; }
          curl -sf -H "Authorization: Bearer $tok" http://127.0.0.1:8964/v1/ping | tee /tmp/ping.json
          # 用 python3 -c 而不是 heredoc：YAML 的字面块会把整段一起缩进，于是结束标记
          # `PY` 前面带着空格，bash 认不出来（`<<-` 只吃 tab 不吃空格），heredoc 永不
          # 终止、这一步挂到超时。这个坑不会在本地 shell 里复现。
          python3 -c "import json;d=json.load(open('/tmp/ping.json'));assert d['ok'] is True,d;assert d.get('backendDegraded') is not True,d;print('ping ok:',d)"

          # 重启一次，验证 /data 上的东西是持久的（登录还在、库还在）。
          docker restart photoar-ci
          for i in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Health.Status}}' photoar-ci 2>/dev/null || echo starting)
            [ "$st" = "healthy" ] && break
            [ "$i" = "60" ] && { echo "::error::重启后没能变 healthy"; docker logs photoar-ci; exit 1; }
            sleep 2
          done
          curl -sf -H "Authorization: Bearer $tok" http://127.0.0.1:8964/v1/ping >/dev/null \
            || { echo "::error::重启之后原来的会话失效了 —— /data 没持久化"; exit 1; }
          echo "重启后会话仍然有效，/data 持久化正常"

          # 「两个进程都活着」不用另外数进程去证：上面 `/` 是 200 就说明 Node 在，
          # 而这一句登录之后的 `/v1/ping` 是 200 就说明 Python 在（它走的是反代）。
          # 试过在这里数 /proc —— slim 镜像里没有 ps，按 /proc 数又会把检查命令自己的
          # cmdline 数进去（实测 5 而不是 2）。冗余的断言不如没有。

      - name: 容器日志（失败时看这里）
        if: always()
        run: docker logs photoar-ci || true

      - name: 收摊
        if: always()
        run: |
          docker rm -f photoar-ci || true
          docker volume rm photoar-ci-data || true

      # ---- 到这里镜像已经被起来打过接口了，才允许推出去 ----

      - name: 登录 GHCR
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 仓库自带的 token 就够，不用另配 PAT
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 打 v1.2.3 得到 :1.2.3 和 :1.2；手动跑得到当前分支名（如 :main）。
          # :sha-xxxxxxx 一直有，用来精确回滚到某次提交。
          #
          # latest 无条件更新：只有打 tag 和手动勾 publish 才会走到这里，所以
          # 「latest = 我上次特意发布的那一版」就是准确的语义。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=true

      # 用 docker tag + push 而不是再跑一次 build-push-action：后者会重新 build
      # （即便全部命中缓存，产出的也是"另一次构建"），而这里要的正是**把刚刚跑过的
      # 那个镜像**推出去。photo-ar-server:ci 就在本地 docker 里，直接改名推走。
      - name: 推镜像
        id: push
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        run: |
          set -euo pipefail
          echo "${{ steps.meta.outputs.tags }}" | while read -r t; do
            [ -z "$t" ] && continue
            echo "推 $t"
            docker tag photo-ar-server:ci "$t"
            docker push "$t"
          done

      # ---- 运行页上的那份说明 ----
      #
      # 「这一版怎么拿、怎么起、从哪访问」写进 Job Summary，直接显示在这次 run 的页面上。
      # 为什么要在这里再写一遍（而不是只指向 docs/deploy.md）、以及它凭什么不会变成
      # 一份过时的拷贝，都写在那个脚本的 docstring 里。
      #
      # `if: always()`：编镜像或冒烟挂了的时候它走另一条分支 —— **不给部署说明**，
      # 只说清楚"没有可部署的东西"和先看哪里。绿一半的运行页上放一份部署指南，
      # 读的人会以为有东西可部署。
      #
      # 摘要生成放在最后一步而不是塞进上面那几个 run：它要同时知道镜像编没编出来、
      # 冒烟过没过、推没推出去，而这三件事分散在三个 step 的 outcome 里。
      - name: 写部署说明到 Job Summary
        if: always()
        env:
          # IMAGE 从上面 workflow 级的 env 继承，不用在这里再写一遍
          VERSION: ${{ steps.ver.outputs.value }}
          TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          # 推失败也算没发布 —— 那时 registry 上还是上一版，说"已推送"就是谎话。
          PUBLISHED: ${{ steps.push.outcome == 'success' }}
        run: python3 .github/scripts/summary.py
