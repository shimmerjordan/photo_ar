# 唯一的一条流水线：单元测试（Python + 网页版）→ 编镜像 → 把镜像当生产环境跑一遍
# →（勾了 publish 时）推 GHCR →（勾了 release 时）建 Release。
#
# **发版只手动触发**（Actions → server → Run workflow）；推 main / 开 PR 只自动跑
# 检查（test/web/lint，vendor/ 变动多一个 golden），不产出镜像。版本号、要不要动
# latest、要不要建 Release 全在那个手动触发的界面上填，见下面 `on:` 那一段。
#
# 镜像里是**两个进程**：Node 的网页版在前（唯一的监听者）、Python 的后端在
# 127.0.0.1:8965。所以 E2E 那一步同时打三种 URI：`/`（网页版）、`/admin`（反代）、
# `/v1/*`（反代）。只打 `/v1` 的话，合并这件事本身一个字都没被验证到。
#
# ════════════════════════════════════════════════════════════════════════
# 发版是明确动作：只有 workflow_dispatch 会构建并推镜像。
# 推 main / 开 PR 自动跑 test、web、lint —— 不产出任何镜像。
# vendor/ 下的 opencv 变动会额外跑一次浏览器 golden（换 OpenCV 版本 = 换特征空间）。
#
# ## 三层各守什么
#
#   1. **单元测试** —— 逻辑回归。装的是 `pip install -e ".[dev]"`，也就是
#      **pyproject 声明的那份依赖**，顺手验证「照着 README 装能不能跑起来」。
#   2. **编镜像** —— 用与 NAS 上完全同一份 Dockerfile，守「本机能跑、镜像里缺个包」。
#   3. **起容器打接口** —— 守 build 覆盖不到的那一半，并且这是唯一验证
#      **Dockerfile 里那三个 pip 包够不够**的地方（第 1 层装的是 pyproject 那份，
#      两份清单不必也不该保持一致）。
#
# ## 运行页上那份部署说明
#
# 最后一步把「这一版怎么拿、怎么起、从哪访问」写进 Job Summary（`.github/scripts/summary.py`），
# 所以看着构建变绿的人不用再去翻仓库找 tag 和命令。它**只在冒烟过了的时候**给部署说明；
# 挂了就只说"没有可部署的东西、先看哪一步"。它声称的每条 URI 都是上面那一步真打过的，
# 那条最小 `docker run` 与上面跑通的那条是同一组必填项（`tests/test_ci_summary.py` 从这个
# 文件里抠出来做比对）—— 所以它讲不出没被验证过的话。
#
# ## 发版
#
# Actions → server → Run workflow，四个输入：
#
#   publish  ✅   推镜像到 GHCR。不勾就只跑一遍检查，什么都不发出去
#   version  0.1.2   镜像 tag、烧进镜像的版本号、Release 名字，三处同一个值
#   latest   ✅   把 :latest 指到这一版
#   release  ✅   建 GitHub Release（顺带打 git tag v0.1.2）
#
# 只想验一遍代码：四个全留默认，跑完什么都不会推出去。
# 想推一个能拉的镜像试试但不占版本号：只勾 publish，得到 `:sha-<短sha>`。
#
# 第一次推完要手动做一件事：GHCR 上新建的包**默认是 private**，NAS 上
# `docker compose pull` 会 denied。仓库右侧 Packages → photo-ar-server →
# Package settings → Change visibility 改成 public（或者在 NAS 上 docker login）。
# ════════════════════════════════════════════════════════════════════════

name: server

on:
  workflow_dispatch:
    inputs:
      # 这四行 description 是**填表时**看的，不是学习用的：只说"勾不勾、填什么"，
      # 不说这个值流到哪儿去（那些写在上面「发版」那一节，给读这个文件的人看）。
      # 别再往括号里塞实现细节 —— 界面把长文本折成三四行，四个输入就糊成一片。
      publish:
        description: "推镜像到 GHCR（不勾＝只跑检查）"
        type: boolean
        default: false
      version:
        description: "版本号，如 0.1.2（留空＝只打 sha-xxxxxxx）"
        type: string
        default: ""
      latest:
        description: "顺便把 :latest 指过来"
        type: boolean
        default: false
      release:
        description: "建 GitHub Release + git tag（需填版本号）"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

# 推代码只跑检查（test / web / lint），零产出；发版（image）只在手动触发时跑，见那个 job 的 if。
permissions:
  contents: read

concurrency:
  # 手动重复点两次 Run workflow 不该并行推同一组 tag；push 之间按 ref 排队。
  group: server-${{ github.event_name }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  # ghcr.io/<owner>/photo-ar-server。用 repository_owner 而不是写死用户名，
  # fork 出去的仓库不必改这个文件。
  IMAGE: ghcr.io/${{ github.repository_owner }}/photo-ar-server

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # 钉版本（与开发机 .venv 里那份一致）：ruff 的规则集偶尔跨版本变化，
      # 不钉的话本地 ruff check . 绿、CI 上 ruff check . 红这种事会真的发生。
      - run: pip install "ruff==0.16.6" && ruff check .

  test:
    runs-on: ubuntu-latest
    # 1000+ 个用例里有一批要跑真的 ORB + RANSAC，比纯逻辑测试慢；本机整套约 6 分钟，
    # runner 上约 10 分钟。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # 与 Dockerfile 里的 python:3.11-slim 同版本
          cache: pip

      # pyproject 里是 opencv-python（**非** headless），`import cv2` 要 libGL.so.1，
      # 而 runner 上没有。装两个系统库比改依赖轻 —— 改成 headless 会影响本机开发时
      # 那些要弹窗看图的 bench 脚本。
      - name: 装系统库
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      # 装 pyproject 声明的那一份，而不是照抄 Dockerfile 里的 pip 行。
      # 「Dockerfile 那三个包够不够」由下面 image job 跑真镜像来验。
      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 测试里的 arcoreimg / ffmpeg / ffprobe 全是 conftest 造的假二进制，
      # 所以这里不需要真的装它们。
      - name: 单元测试
        run: pytest -q

  # 网页版那 100 多条零依赖测试。单独一个 job 而不是接在 test 后面：它不需要 Python、
  # 不需要 opencv、不需要装系统库，十几秒就跑完，与上面那十分钟并行。
  #
  # 只跑 `npm test`。`test:e2e` / `test:worker` 仍不进 CI（每次推代码等三分钟不值）；
  # `test:golden` 只在 vendor/ 变动时跑，见下面的 golden job。`test:smoke` / `test:pages`
  # 要一个跑着的容器 + 一个真库，CI 上没有。
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # 与 Dockerfile 里抠出来的那个 node 同大版本
      # 没有 npm ci —— 这个包一个依赖都没有（package.json 里没有 dependencies）。
      - name: 网页版单元测试
        working-directory: web-front
        run: npm test

  golden:
    # 换 OpenCV 版本 = 换特征空间。golden 一红说明全库 desc.bin 作废，这件事不能靠人记得。
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0（全history）而不是 2：push 事件下一次推送可能带好几个 commit，
      # `HEAD~1` 只看最后一个，中间那些改了 vendor/ 的会被漏掉。
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: changed
        run: |
          # PR 事件：checkout 出来的是那个合成 merge commit，`HEAD~1` 是它的第一父，
          # 也就是 PR 的 base —— 天然就是整个 PR 的范围，不用换。
          # push 事件：用 `github.event.before..HEAD` 覆盖这整次推送的所有 commit；
          # `before` 是全零（新分支第一次推）或者已经不可达（强推）时退回 `HEAD~1`。
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$before" 2>/dev/null; then
            range="$before..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          if git diff --name-only $range | grep -q '^web-front/public/vendor/'; then echo "yes=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.yes == '1'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      # harness.js 不用 playwright（见它自己的 docstring）——它 spawn 的是系统的
      # google-chrome，直接调 CDP。GH 的 ubuntu-latest runner 本来就带 google-chrome，
      # 这里只是兜底：真的没有就装系统 Chromium，并通过 CHROME 环境变量告诉 harness。
      - if: steps.changed.outputs.yes == '1'
        run: |
          command -v google-chrome >/dev/null && exit 0
          sudo apt-get update && sudo apt-get install -y --no-install-recommends chromium-browser
          echo "CHROME=$(command -v chromium-browser)" >> "$GITHUB_ENV"
      - if: steps.changed.outputs.yes == '1'
        working-directory: web-front
        run: npm run test:golden

  image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [lint, test, web]
    timeout-minutes: 30
    permissions:
      # contents 要 write 是为了「建 Release」那一步（它顺带打 git tag）。
      # 其余步骤只读，但权限是 job 级的，没法再收窄。
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 烧进镜像的版本号。它显示在设置页「关于」那一行（连按 7 下进调试模式的那一行），
      # 也是 `GET /api/config` 回的 `version`。
      #
      # 取值刻意与下面推出去的 tag **对得上**，这样"设置页上那串字"能直接反查到镜像：
      #   填了版本号 → `0.1.2`，与镜像 tag 逐字符相同
      #   留空       → `sha-1a2b3c4`，与 `type=sha,format=short` 产出的那个逐字符相同
      #
      # 不注入的话网页版会退回 `x.y.z-dev` —— 那个后缀的语义是"不是 CI 出的镜像"。
      # 而在补上它之前，**CI 出的镜像也全都写着 -dev**，于是那一行读数在真正会被
      # 部署的那些镜像里恰好是没用的。
      #
      # `RAW_VERSION` 走 env 而不是直接把 `${{ }}` 展开进脚本正文：它是**界面上手输的
      # 字符串**，内联展开等于把它拼进 shell 源码。
      - id: ver
        env:
          RAW_VERSION: ${{ inputs.version }}
          WANT_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          v="$(printf '%s' "$RAW_VERSION" | tr -d '[:space:]')"
          if [ -n "$v" ]; then
            # 只收 `1.2.3` / `1.2.3-rc1` 这种。挡住的不是恶意输入（能点 Run workflow
            # 的人本来就有写权限），而是手滑：`v0.1.2`（多个 v，镜像 tag 会变成 `v0.1.2`
            # 而 `{{major}}.{{minor}}` 派生不出来）、`0.1`（缺一位）、带空格或斜杠
            # （docker tag 直接非法，而那时镜像已经编完了才失败）。
            case "$v" in
              [0-9]*.[0-9]*.[0-9]*) : ;;
              *) echo "::error::版本号要形如 0.1.2（不要带 v 前缀），收到的是 '$v'"; exit 1 ;;
            esac
            case "$v" in
              *[!0-9A-Za-z.+-]*) echo "::error::版本号里有非法字符：'$v'"; exit 1 ;;
            esac
          else
            if [ "$WANT_RELEASE" = "true" ]; then
              echo "::error::勾了「建 Release」就必须填版本号 —— Release 得有个名字。"
              exit 1
            fi
            v="sha-${GITHUB_SHA::7}"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "版本号 $v"
          # `0.1.2` → `0.1`。metadata-action 的 `{{major}}.{{minor}}` 只认从 git ref
          # 解析出来的 semver，而我们的版本号是界面上手输的，所以自己派生；没填版本号
          # （`sha-` 前缀）时没有 major.minor 可言，不输出。
          case "$v" in
            sha-*) : ;;
            *) echo "majmin=${v%.*}" >> "$GITHUB_OUTPUT" ;;
          esac

      # 只构建 linux/amd64。目标机器是 QNAP TS-464C2（Celeron N5095，x86-64）；
      # 加 arm64 会让构建时间翻倍（opencv 的 arm64 wheel 要走 QEMU 模拟），而现在没有
      # 任何 arm 机器要跑它。将来真要上 arm，改这一行。
      #
      # `load: true` 而不是 `push: true`：先把镜像装进本地 docker 跑一遍，验过了再推。
      # 这样**推上去的就是被测过的那一个镜像**（分两次 build 的话，推的那一份严格来说
      # 没被跑过）。
      #
      # 镜像里不含 vocab.npz（你自己照片训的数据，运行时 bind mount 送进容器，
      # 见 docker-compose.yml）。
      - name: 编镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: photo-ar-server:ci
          # Dockerfile 里这个 ARG 刻意放在所有 COPY 之后，所以它每次都变也只会让
          # 最后几行元数据失效，不会把 120MB 的 node 二进制那层顶掉。
          build-args: |
            PHOTOAR_VERSION=${{ steps.ver.outputs.value }}
          # 层缓存存在 Actions 的缓存里：不改依赖的话，opencv 那层不会重装。
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # 把它当生产环境跑：非 root、/data 是 volume、healthcheck 由镜像自己带。
      #
      # 不设 PHOTOAR_TOKEN 是**刻意**的：`docker/healthcheck.py` 在没配 token 时把 401
      # 也算健康（理由在那个文件的 docstring 里），而这条路径正是默认部署走的那条 ——
      # 顺手把它验一遍。
      - name: 起容器
        id: run
        run: |
          set -euo pipefail
          docker volume create photoar-ci-data
          # PHOTOAR_ROOTS 是**必填**的：不给的话 entrypoint 直接拒绝启动
          # （「必须设 PHOTOAR_ROOTS（白名单根目录）」）。这一条是照着一次本地实跑
          # 加上的 —— 第一版这个 workflow 少了它，容器 2 秒就 unhealthy。
          # 名字用 ASCII：真实部署里是「照片=/share/Photo」这样的中文名，而在
          # CI 的 shell → docker → python 这条链上省掉一层编码变量。
          #
          # 除了那两个 PHOTOAR_ADMIN_*（为了下面能自动登录测一遍），**这一组必填项
          # 与 job summary 里给出的那条最小 `docker run` 是同一组** —— 也就是说那份
          # 说明是被真的跑过的。哪天多出一个必填变量，这里会先变 unhealthy。
          #
          # 刻意**没有** PHOTOAR_BIND：合并形态下它是空转的。entrypoint 把网页版的
          # HOST 写死成 0.0.0.0、把后端强制按到回环上（那条有安全含义，见
          # docker/entrypoint.py 里 backend_env 的注释），所以外面设它不改变任何事。
          # 留着会让照抄这段的人以为它是必需的。
          docker run -d --name photoar-ci \
            -e PHOTOAR_ADMIN_NAME=admin \
            -e PHOTOAR_ADMIN_PASSWORD=admin \
            -e PHOTOAR_ROOTS=photos=/data/photos,videos=/data/videos \
            -v photoar-ci-data:/data \
            -p 8964:8964 \
            photo-ar-server:ci

          # 等 healthcheck 变 healthy，而不是 sleep 一个固定秒数：镜像自己带
          # HEALTHCHECK，用它就等于顺手验证了那条命令是对的。
          docker/wait-healthy.sh photoar-ci

      - name: 打接口
        id: login
        run: |
          set -euo pipefail
          # 未登录必须被拒（401），不是 200 也不是 500。
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8964/v1/ping)
          echo "未登录 /v1/ping -> $code"
          [ "$code" = "401" ] || { echo "::error::未登录的请求本该 401"; exit 1; }

          # ---- 合并容器的三种 URI 都在同一个端口上 ----
          #
          # 这三条守的是「两个进程都活着、而且前面那个的路由表是对的」。少了它们，
          # 一个「Node 起不来但 Python 好好的」的镜像会全绿通过 —— 而那个镜像对宾客
          # 来说是完全不可用的（`/` 连不上），对运维却看不出问题（`/v1` 正常）。
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8964/)
          echo "网页版 / -> $code"
          [ "$code" = "200" ] || { echo "::error::网页版没起来（/ 应当是 200）"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8964/admin)
          echo "管理台 /admin -> $code"
          [ "$code" = "200" ] || { echo "::error::/admin 没被反代到后端"; exit 1; }

          # 网页版自己的存活端点。它不碰上游也不碰识别库，所以它 200 而 `/` 500 的
          # 组合能把「进程活着但静态目录没拷进镜像」区分出来。
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8964/healthz)
          echo "存活探测 /healthz -> $code"
          [ "$code" = "200" ] || { echo "::error::/healthz 不对"; exit 1; }

          # 登录 → 拿 token → 打 ping。这三步串起来就覆盖了「路由表装上了、
          # 鉴权链通了、SQLite 能写」。用的是默认口令（admin/admin），所以顺手断言
          # 服务端真的回了 mustChangePassword: true —— 口径抄 tests/server/test_app_auth.py
          # 里 test_default_password_login_demands_a_change 断言登录响应体那一段；
          # 断言而不是注释，才是真的验过而不是嘴上说说。
          resp=$(curl -s -X POST http://127.0.0.1:8964/v1/auth/login \
                  -H 'Content-Type: application/json' \
                  -d '{"name":"admin","password":"admin"}')
          tok=$(printf '%s' "$resp" | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['mustChangePassword'] is True, f'默认口令登录应当要求改密，回的是 {d}';print(d['token'])")
          test -n "$tok" || { echo "::error::登录没拿到 token"; exit 1; }
          # 先打码再写进 GITHUB_OUTPUT：token 本身不敏感（下一步就用它打接口），
          # 但日志/摘要里裸露一个能登录的活 token 没有任何好处。
          echo "::add-mask::$tok"
          echo "tok=$tok" >> "$GITHUB_OUTPUT"

          curl -sf -H "Authorization: Bearer $tok" http://127.0.0.1:8964/v1/ping \
            | python3 -c "import json,sys;d=json.load(sys.stdin);assert d['ok'] is True,d;assert d.get('backendDegraded') is not True,d;print('ping ok:',d)"

          # 「两个进程都活着」不用另外数进程去证：上面 `/` 是 200 就说明 Node 在，
          # 而这一句登录之后的 `/v1/ping` 是 200 就说明 Python 在（它走的是反代）。
          # 试过在这里数 /proc —— slim 镜像里没有 ps，按 /proc 数又会把检查命令自己的
          # cmdline 数进去（实测 5 而不是 2）。冗余的断言不如没有。

      - name: 版本号
        id: version
        env:
          # 同上：不把 tag 名内联展开进脚本正文
          WANT_VERSION: ${{ steps.ver.outputs.value }}
        run: |
          set -euo pipefail
          # 版本号真的烧进去了吗。`/api/config` 不需要登录（访客也要拿阈值），所以这一句
          # 也顺带证明了"确认线上是哪一版"那条 curl 是真能用的。
          #
          # 断言而不是只打印：漏掉 build-arg 的表现是设置页上写着 `x.y.z-dev`，
          # 而那**看起来完全正常** —— 不比对就永远发现不了。（这一步加进来之前，
          # CI 出的每一个镜像都是 -dev。）
          curl -sf http://127.0.0.1:8964/api/config \
            | python3 -c "import json,os,sys;g=json.load(sys.stdin)['version'];w=os.environ['WANT_VERSION'];assert g==w,f'版本号没烧进镜像：容器说 {g}，应当是 {w}';print('版本号 ok:',g)"

      - name: 重启验持久化
        id: persist
        env:
          TOK: ${{ steps.login.outputs.tok }}
        run: |
          set -euo pipefail
          # 重启一次，验证 /data 上的东西是持久的（登录还在、库还在）。
          docker restart photoar-ci
          docker/wait-healthy.sh photoar-ci
          curl -sf -H "Authorization: Bearer $TOK" http://127.0.0.1:8964/v1/ping >/dev/null \
            || { echo "::error::重启之后原来的会话失效了 —— /data 没持久化"; exit 1; }
          echo "重启后会话仍然有效，/data 持久化正常"

      - name: 容器日志（失败时看这里）
        if: always()
        run: docker logs photoar-ci || true

      # ---- 到这里镜像已经被起来打过接口了，才允许推出去 ----

      - name: 登录 GHCR
        if: inputs.publish == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 仓库自带的 token 就够，不用另配 PAT
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: inputs.publish == true
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 全部由界面上那几个输入决定，不再从 git ref 猜：
          #
          #   :0.1.2        填了版本号才有
          #   :0.1          从版本号派生（跟着这条线的补丁版本走）
          #   :sha-1a2b3c4  **一直有** —— 精确回滚到某次提交靠它
          #   :latest       只有勾了「同时更新 latest」才动
          #
          # latest 从"无条件"改成"勾了才动"（2026-08-06）：以前只有发版才走到这里，
          # 所以无条件是准确的；现在手动跑一次不填版本号也能推（得到一个 sha- tag），
          # 那种"我只是想推一个能拉的镜像试试"不该把 latest 一起带走。
          tags: |
            type=raw,value=${{ steps.ver.outputs.value }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ steps.ver.outputs.majmin }},enable=${{ steps.ver.outputs.majmin != '' }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ inputs.latest == true }}

      # 用 docker tag + push 而不是再跑一次 build-push-action：后者会重新 build
      # （即便全部命中缓存，产出的也是"另一次构建"），而这里要的正是**把刚刚跑过的
      # 那个镜像**推出去。photo-ar-server:ci 就在本地 docker 里，直接改名推走。
      - name: 推镜像
        id: push
        if: inputs.publish == true
        run: |
          set -euo pipefail
          echo "${{ steps.meta.outputs.tags }}" | while read -r t; do
            [ -z "$t" ] && continue
            echo "推 $t"
            docker tag photo-ar-server:ci "$t"
            docker push "$t"
          done

      # 建 GitHub Release。排在推镜像**之后**：Release 是对外的公告，而公告一个还没
      # 推上去的镜像等于给人一个拉不到的地址。
      #
      # `gh release create` 会顺带打 git tag（`--target` 指向这次构建的那个 commit），
      # 所以不需要事先 `git tag`。这也是 `contents: write` 的唯一用途。
      - name: 建 Release
        if: inputs.publish == true && inputs.release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.value }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "镜像（同一个，任选其一）："
            echo
            echo '```'
            printf '%s\n' "$TAGS" | sed 's/^/docker pull /'
            echo '```'
            echo
            echo "怎么部署、从哪访问：见这次 run 页面顶部的 Job Summary。"
          } > /tmp/relnotes.md
          gh release create "v$V" --title "v$V" --notes-file /tmp/relnotes.md \
            --target "$GITHUB_SHA"
          echo "Release v$V 建好了"

      # ---- 运行页上的那份说明 ----
      #
      # 「这一版怎么拿、怎么起、从哪访问」写进 Job Summary，直接显示在这次 run 的页面上。
      # 为什么要在这里再写一遍（而不是只指向 docs/deploy.md）、以及它凭什么不会变成
      # 一份过时的拷贝，都写在那个脚本的 docstring 里。
      #
      # `if: always()`：编镜像或冒烟挂了的时候它走另一条分支 —— **不给部署说明**，
      # 只说清楚"没有可部署的东西"和先看哪里。绿一半的运行页上放一份部署指南，
      # 读的人会以为有东西可部署。
      #
      # 摘要生成放在最后一步而不是塞进上面那几个 run：它要同时知道镜像编没编出来、
      # 冒烟过没过、推没推出去，而这三件事分散在三个 step 的 outcome 里。
      - name: 写部署说明到 Job Summary
        if: always()
        env:
          # IMAGE 从上面 workflow 级的 env 继承，不用在这里再写一遍
          VERSION: ${{ steps.ver.outputs.value }}
          TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          # e2e 现在是四个 step，分别传各自的 outcome —— blocked() 里按这四个
          # 名字（起容器/打接口/版本号/重启验持久化）分别显示，而不是只看最后一个。
          RUN_OUTCOME: ${{ steps.run.outcome }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          # 推失败也算没发布 —— 那时 registry 上还是上一版，说"已推送"就是谎话。
          PUBLISHED: ${{ steps.push.outcome == 'success' }}
        run: python3 .github/scripts/summary.py
