# 出安卓包。跟 publish-image.yml 同一个规矩：**打 tag 或手动点一下**才跑 ——
# 发版是个决定，不是提交的副作用。日常的把关靠本地那一行
#   cd android && ./gradlew :arview:testDebugUnitTest
# （20 个纯 JVM 用例，不碰网络也不碰那 75 MiB 运行时，几秒钟出结果）。
# PR 上会自动跑一遍，免得靠记性。
#
# 这里和本地构建**唯一**的差别是 `-Pphotoar.deviceAbiOnly`：
#
#   模拟器要用的 x86 / x86_64 两套原生库，真机一个也用不到，而它们不便宜 ——
#   每个 ABI 里 libonnxruntime.so 单独就 19.4 MiB，两套加起来实测 39.3 MiB
#   （155,713,877 → 114,533,262 字节）。CI 出的包是给真机装的，砍掉。
#   本地默认全带：跑 emulator 验兜底路径是日常调试手段，不能为了发版把它废掉。
#
# 签名：CI 包与本地包**已经一致**，可以直接覆盖安装。
#
# 以前不行 —— release 沿用 debug key，而 runner 上没有 ~/.android/debug.keystore，
# AGP 每次现生成一把新的，于是每次 CI 出的包签名都不同，真机上两边换着装必须先卸载
# （`INSTALL_FAILED_UPDATE_INCOMPATIBLE`）。现在仓库里提交了一把固定的 sideload
# 密钥（android/keystore/photoar-release.jks），**所有变体、所有机器、CI 一律用它**，
# 详见 app/build.gradle.kts 里那段注释。下面「校验签名」那一步盯着这件事，
# 因为它一旦回退就只在真机上表现成「装不上」，而 CI 全绿。
name: android

on:
  push:
    tags: ["v*"]
  # PR 只跑测试，不出包（下面的 if 管着）。加 paths 是因为改服务端的 PR
  # 不该顺手拉起一次安卓构建；tag 那条**故意不加** paths —— tag 指向的那次
  # 提交要是只改了 docs/，带 paths 的过滤会把整个发版跳掉。
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  # 测试和出包放在同一个 job 里：拆开的话两边都要各付一次 checkout + JDK +
  # 缓存恢复，而这里没有 publish-image 那种「第二步需要完全不同的工具链」的理由。
  # 顺序即依赖 —— 测试不过，后面的步骤不会跑。
  build:
    runs-on: ubuntu-latest
    # 发 Release 要写权限。默认的 GITHUB_TOKEN 是只读的，缺这一段的表现是
    # 「构建全绿，最后一步 403」—— 而那一步正是把包交到人手上的那一步。
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 顺带管掉 gradle 的下载缓存和 configuration cache
      - uses: gradle/actions/setup-gradle@v4

      # 内置的 ARCore 运行时是从 GitHub Releases 下的 75 MiB APK，缓存住免得
      # 每次发版都重下。key 挂在 arview/build.gradle.kts 上：版本号和 sha256
      # 都写在那个文件里，换版本自然换 key，缓存不会串味。
      #
      # 缓存丢了也只是慢一点：那个任务的命中判据是**内容哈希**而不是「文件在不在」，
      # 半个包、旧版本、手塞进来的都会被重下（见 ArcoreDownloadTask）。
      - uses: actions/cache@v4
        with:
          path: android/.arcore
          key: arcore-runtime-${{ hashFiles('android/arview/build.gradle.kts') }}

      # 纯 JVM 单测：AR 安装决策的状态机、几何、清单解析。--dry-run 确认过它
      # 不会拉起 arcore 下载任务，所以这一步就算缓存全空也是几十秒。
      - name: 单元测试
        run: ./gradlew :arview:testDebugUnitTest

      - name: 出真机 APK（不带模拟器 ABI）
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: ./gradlew :app:assembleRelease -Pphotoar.deviceAbiOnly=true

      # 守两个「构建成功但包是坏的」的失败模式，两个都真实存在过：
      #
      # 1. assets 里没有 ARCore。noCompress / addGeneratedSourceDirectory 任何一
      #    环脱钩，包里就没有那份运行时 —— 而构建不会报错，要装到手机上、走到
      #    「首次使用要装一个 AR 组件」那一步才发现。
      # 2. ABI 过滤没生效。上面那个 -P 拼错、或者哪天 defaultConfig 被改动，
      #    结果就是悄悄胖回 39 MiB，没人会盯着体积看。
      - name: 校验包内容
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          ls -l "$apk"
          # 查的是**拆开之后**那几样，不是整包的 assets/arcore.apk。
          #
          # 这一行以前查的正是 `assets/arcore.apk`，而那条路（整包塞进 assets、
          # 运行期再解）早就换掉了：现在 `ArcoreUnpackTask` 把运行时拆成
          # assets/arcore_rt/dex.jar + assets/packed_profiles/ + lib/<abi>/*.so。
          # 于是这个检查恒定失败 —— 而它是「守着构建成功但包是坏的」的那一步，
          # 恒假和恒真一样没用。
          unzip -l "$apk" | grep -q 'assets/arcore_rt/dex.jar' \
            || { echo "::error::包里没有 ARCore 运行时的 dex（ArcoreUnpackTask 脱钩了）"; exit 1; }
          unzip -l "$apk" | grep -q 'assets/packed_profiles/profiles.toc' \
            || { echo "::error::包里没有 packed_profiles（设备标定库，缺了它 ARCore 在任何机器上都起不来）"; exit 1; }
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libarcore_c.so' \
            || { echo "::error::包里没有 ARCore 的原生库"; exit 1; }
          if unzip -l "$apk" | grep -qE 'lib/x86'; then
            echo "::error::模拟器 ABI 没被过滤掉，-Pphotoar.deviceAbiOnly 没生效"
            unzip -l "$apk" | grep -E 'lib/x86'
            exit 1
          fi
          echo "内置运行时在包里，模拟器 ABI 已剔除"

      # 签名必须是那把提交进仓库的固定密钥，而不是 runner 现生成的 debug key。
      #
      # 这一步存在的理由：签名回退**不会让构建失败**，只会让真机上「覆盖安装」变成
      # 「必须先卸载」，而那时候数据（登录、离线缓存）已经没了。所以在 CI 里就把它钉住。
      - name: 校验签名（覆盖安装的前提）
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          # apksigner 在 build-tools 里，路径随版本变，所以现找一个。
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "$apk" | tee /tmp/certs.txt
          want=$(keytool -list -v -keystore keystore/photoar-release.jks \
                   -storepass photoarsideload 2>/dev/null \
                 | grep -oE 'SHA1: [0-9A-F:]+' | head -1 | cut -d' ' -f2 | tr -d ':')
          got=$(grep -oiE 'SHA-1 digest: [0-9a-f]+' /tmp/certs.txt | head -1 | awk '{print $NF}')
          echo "期望 $want"
          echo "实得 $got"
          if [ "$(echo "$want" | tr 'A-Z' 'a-z')" != "$(echo "$got" | tr 'A-Z' 'a-z')" ]; then
            echo "::error::APK 不是用 keystore/photoar-release.jks 签的 —— 这个包不能覆盖安装"
            exit 1
          fi
          echo "签名正确，可以覆盖安装"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: photo-ar-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/app-release.apk
          # 装一次就够了，不必长期占额度
          retention-days: 30

      # 打了 tag 才发 Release。artifact 只有登录 GitHub 的人能下，而这个包是要
      # 发给宾客装的 —— Release 的下载链接不需要登录。
      - name: 发 Release（只在 tag 上）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          body: |
            真机 APK（arm64 + armv7，不含模拟器 ABI）。

            **可以直接覆盖安装** —— 所有构建（CI 与本地）都用仓库里那把固定的
            sideload 密钥签名（`android/keystore/photoar-release.jks`）。

            > **仅有一次例外**：如果手机上装的还是这次改动**之前**的包（那时候用的是
            > 每台机器各自生成的 debug 密钥），这一次要先 `adb uninstall app.photoar`
            > 再装；之后历次升级都不用再卸载了。
