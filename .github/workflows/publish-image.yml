# 把 photo-ar-server 的镜像推到 GHCR，NAS 上直接 `docker compose pull` 就能部署，
# 不必把源码传上去、也不必在 N5095 上编译（那台机器构建一次约 1 分钟，还得先装
# 构建工具链）。
#
# 两个刻意的取舍：
#
# 1. **只构建 linux/amd64**。目标机器是 QNAP TS-464C2（Celeron N5095，x86-64）。
#    加 arm64 会让构建时间翻倍（opencv 的 arm64 wheel 要走 QEMU 模拟），而现在
#    没有任何 arm 机器要跑它。将来真要上 arm，改这一行就行。
#
# 2. **镜像里不含 arcoreimg 和 vocab.npz**。
#    - arcoreimg 是 ARCore SDK 里的闭源二进制，不可再分发，公开镜像里更不能带；
#    - vocab.npz 是用你自己的照片训出来的词汇树，属于你的数据。
#    两个都在运行时用 bind mount 送进容器（见 docker-compose.yml）。缺了 arcoreimg
#    服务照样起，只有入库会报 ArcoreimgMissing 并说明去哪儿取。
#
# 第一次跑完之后要手动做一件事：GHCR 上新建的包**默认是 private**，NAS 上
# `docker compose pull` 会 denied。到仓库右侧 Packages → photo-ar-server →
# Package settings → Change visibility 改成 public（或者在 NAS 上 docker login）。
name: publish-image

# 只有**打 tag** 或者**手动点一下**才会构建发布。日常往 main 推代码不会动镜像 ——
# 发版是个决定，不是提交的副作用（也省掉每次推代码都跑一遍构建的时间和额度）。
#   发版：git tag v0.2.0 && git push origin v0.2.0
#   临时发一版：Actions 页面 → publish-image → Run workflow
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # ghcr.io/<owner>/photo-ar-server。用 repository_owner 而不是写死用户名，
  # fork 出去的仓库不必改这个文件。
  IMAGE: ghcr.io/${{ github.repository_owner }}/photo-ar-server

jobs:
  # 发布前先跑测试。发一个没测过的镜像出去，比不发更糟 —— 装在 NAS 上的东西
  # 出问题时你第一反应不会是「镜像是坏的」。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # pyproject 里是 opencv-python（非 headless），import cv2 需要 libGL.so.1，
      # 而 runner 上没有。装两个系统库比改依赖轻。
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: pip install -e ".[dev]"
      # 测试里的 arcoreimg / ffmpeg / ffprobe 全是 conftest 造的假二进制，
      # 所以这里不需要真的装它们。
      - run: pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 仓库自带的 token 就够，不用另配 PAT
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 打 v1.2.3 得到 :1.2.3 和 :1.2；手动跑得到当前分支名（如 :main）。
          # :sha-xxxxxxx 一直有，用来精确回滚到某次提交。
          #
          # latest 无条件更新：既然只有打 tag 和手动才会跑到这里，「latest = 我上次
          # 特意发布的那一版」就是准确的语义。原来挂在 is_default_branch 上，改成
          # 不推 main 之后那个条件永远为假，latest 会停在旧版本上不动。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=true

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 层缓存存在 Actions 的缓存里：不改依赖的话，opencv 那层不会重装。
          cache-from: type=gha
          cache-to: type=gha,mode=max
