# QNAP Container Station 用。`docker compose up -d` 或直接在 Container Station
# 的「应用程序」里贴这份 YAML。
#
# 三处必须按自己的 NAS 改：
#   1. PHOTOAR_TOKEN —— 换成自己的随机串（openssl rand -hex 24）
#   2. 照片与视频所在的共享文件夹挂载点（下面 volumes 里的两条 :ro）
#   3. deploy/config.json 里的 roots 必须与这里挂进去的容器内路径一致
services:
  photo-ar-server:
    build: .
    image: photo-ar-server:phase1
    container_name: photo-ar-server
    restart: unless-stopped
    # 识别是 CPU 密集的（ORB + RANSAC）。N5095 只有 4 核，留一核给
    # cloudflared / CloudDrive2 / QTS 自己，不然扫描时整台 NAS 都发木。
    cpus: "3.0"
    mem_limit: 3g
    # 核显透进容器，转码走 h264_vaapi 而不是 libx264。软编实测（本机 3 核配额，
    # 一条 30 秒 1080p）：preset veryfast 18.2s、slow 89.2s；折算到 N5095
    # 分别约 56 秒和 4.6 分钟一条。入库的 attach 是同步请求，而 Cloudflare 的
    # Proxy Read Timeout 是 125 秒 —— 软编 + 慢 preset 走隧道入库必然 524。
    # 没有这一段（或者节点不存在）不会报错，服务自己回退软编——所以想确认
    # 硬编真的生效，把 config.json 的 video_encoder 显式写成 "h264_vaapi"，
    # 探测不到会直接报错（见 transcode.resolve_encoder）。
    devices:
      - /dev/dri:/dev/dri
    # QTS 上 /dev/dri/renderD128 通常属 root:root 且 0666，如果发现容器内
    # 打不开设备，用 `stat -c '%g' /dev/dri/renderD128` 查到 GID 后填进来。
    # group_add:
    #   - "44"
    ports:
      # 只监听 LAN/Tailscale。外网走已有的 cloudflared，不在这里暴露。
      - "8964:8964"
    environment:
      PHOTOAR_TOKEN: "改成你自己的随机串"
      # 词汇树用 UTF-8 路径，容器里 locale 默认是 POSIX，显式设一下省事
      LANG: C.UTF-8
    volumes:
      # 索引、SQLite、转码产物、缩略图。必须是持久卷 —— 丢了要全库重新入库
      # （每张约 1s，一万张三小时）。
      - ./data:/data
      - ./deploy:/config:ro
      # 照片与视频。只读挂载：这个服务永远不改用户的原始文件
      # （唯一的写入是 /v1/upload，落在下面单独一条可写挂载里）。
      - /share/Photo:/share/Photo:ro
      - /share/Video:/share/Video:ro
      # CloudDrive2 把网盘挂成了普通路径，一并挂进来就能直接关联网盘里的视频
      - /share/CloudDrive:/share/CloudDrive:ro
      # /v1/upload 的落地目录，是整份配置里唯一可写的用户目录
      - /share/Photo/_arphoto_inbox:/share/Photo/_arphoto_inbox
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os,urllib.request as u
          t=os.environ.get('PHOTOAR_TOKEN','')
          r=u.Request('http://127.0.0.1:8964/v1/ping',headers={'Authorization':'Bearer '+t})
          u.urlopen(r,timeout=4).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
