# photo-ar —— 一键部署。**一个容器、一个端口，网页版 + 管理台 + API 全在里面。**
#
#   cp .env.example .env && ${EDITOR} .env      # 只有 PHOTOAR_ROOTS 必须看一眼
#   docker compose up -d
#   docker compose logs -f photo-ar-server      # 抄走里面那行随机管理员口令
#
# 起来之后同一个端口按 URI 分：
#
#   http://<NAS>:8964/          宾客扫照片的网页版
#   http://<NAS>:8964/admin     网页管理台
#   http://<NAS>:8964/v1/*      后端 API（批量入库脚本打这里）
#
# ⚠️ **网页版要相机，而相机只在安全上下文里存在** —— `https://` 任意域名都算，
# `http://<局域网IP>` 不算。所以对宾客开放时前面必须有一层 https（现有的
# Cloudflare Tunnel 加一条 ingress 指到这个端口就够）。只用管理台和 API 的话
# http 直连没问题。手机在局域网里自测见下面 WEBFRONT_TLS_CERT。
#
# 这份文件里已经带上了"启动前必须定下来的"每一样东西，所以**不需要 config.json**。
# 想用配置文件（更细的参数：media 策略、self_score_samples、ffprobe 路径……）就把
# deploy/config.json 准备好，下面 `./deploy:/config:ro` 那条挂载已经留着了 ——
# entrypoint 检测到 /config/config.json 存在就用它，环境变量仍然对 token 和口令生效。
#
# 起来之后要改的东西（阈值、闸门、贴图方式、识别后端）都在管理台 `/admin` 里，
# 不用改这份文件（那些是热配置，见 src/photoar/server/appconfig.py）。
#
# ════════════════════════════════════════════════════════════════════════
# 改成你自己的路径
#
# 下面写的 `/share/Photo` 那套是作者 NAS 上的。换成你自己的，要动的是**成对的三处**，
# 而它们必须互相对得上：
#
#   volumes 冒号左边    宿主机上的真实路径
#   volumes 冒号右边    容器内的路径   ┐ 这两个写成**一模一样**
#   PHOTOAR_ROOTS       容器内的路径   ┘
#
# 一样是刻意的：入库时填的那个路径，在宿主机、在容器里、在白名单里是同一个字符串，
# 不用在脑子里换算。
#
# 比如素材全在 `/share/Study/media_bed/photo-ar` 下面（推荐分四个子目录）：
#
#   environment:
#     PHOTOAR_ROOTS: photos=/share/Study/media_bed/photo-ar/photos,videos=/share/Study/media_bed/photo-ar/videos
#     PHOTOAR_UPLOAD_DIR: /share/Study/media_bed/photo-ar/inbox
#   volumes:
#     - /share/Study/media_bed/photo-ar/data:/data                                        # 库，可写
#     - /share/Study/media_bed/photo-ar/photos:/share/Study/media_bed/photo-ar/photos:ro
#     - /share/Study/media_bed/photo-ar/videos:/share/Study/media_bed/photo-ar/videos:ro
#     - /share/Study/media_bed/photo-ar/inbox:/share/Study/media_bed/photo-ar/inbox        # 上传落地，可写
#
# `/data` 是唯一一条左右不一样的：镜像里写死了 `PHOTOAR_DATA=/data`，让它保持默认最省事。
#
# ## 三条约束，每条都有一个不响的失败方式
#
#   1. **`/data` 别落在 `PHOTOAR_ROOTS` 之内。** 落进去的话，服务自己的 SQLite 和索引
#      会出现在管理台的目录浏览器里。不致命（列目录是只读的），但没有理由把它们摆在
#      「选一张照片」的界面上。所以上面那个例子把 ROOTS 指到 photos/ 和 videos/ 两个
#      子目录，而不是整个 photo-ar/。
#   2. **`PHOTOAR_UPLOAD_DIR` 必须在 `PHOTOAR_ROOTS` 之内，且那条挂载不能是 `:ro`。**
#      三种失败长得完全不一样，而只有第一种说了实话：
#        * 不设 → 503 `upload_disabled`，明说"上传功能关闭"；
#        * 设了但落在 ROOTS 之外 → **启动时不报错**，每次上传 403 `path_denied`
#          （落地路径要再过一遍白名单，不信任配置里的前缀）；
#        * 挂载写成了 `:ro` → 前两关都过，写的时候才失败。
#      不用上传功能就干脆留空，那是唯一会明说的那一种。
#   3. **宿主机上的目录要先 `mkdir -p` 出来。** bind mount 的源不存在时，dockerd 会
#      **以 root 身份建一个空目录**，一声不响 —— 然后服务真的去索引那个空目录，
#      表现是"入库一张都找不到"。（`deploy/compose.local.yml` 顶部那个 `!override`
#      就是为这件事存在的。）
#
# ## `PHOTOAR_ROOTS` 里 `照片=` 那半截是什么
#
# 是**显示标签**，不是变量名 —— 变量名是 `PHOTOAR_ROOTS` 本身。标签只用来在管理台的
# 目录浏览器里区分哪个根是哪个，不参与任何路径解析。三种写法都行：
#
#   照片=/share/Photo,视频=/share/Video      标签是中文，界面上显示中文
#   photos=/share/Photo,videos=/share/Video  标签是 ASCII
#   /share/Photo,/share/Video                不给标签，自动取目录名（Photo / Video）
#
# 中文标签能用（下面 `LANG: C.UTF-8` 那行就是为它设的），但它要走
# compose → docker → Python 这条编码链，而换来的只是界面上四个字。纯偏好，随你。
# 两个根撞名（`/a/Photo` 与 `/b/Photo` 都取 `Photo`）会**直接报错**而不是后者覆盖 ——
# 覆盖的后果是其中一个目录整体访问不到，而界面上只是少了一项。
# ════════════════════════════════════════════════════════════════════════
services:
  photo-ar-server:
    # 默认拉 GHCR 上由 CI 构建的镜像。想用别的 tag 就在 .env 里设 PHOTOAR_IMAGE，
    # 例如 ghcr.io/shimmerjordan/photo-ar-server:sha-1a2b3c4 回滚到某次提交。
    image: ${PHOTOAR_IMAGE:-ghcr.io/shimmerjordan/photo-ar-server:latest}
    # ⚠️ 这里**刻意没有** `build: .`（曾经有，挪去 deploy/compose.local.yml 了）。
    #
    # image 与 build 并存时，compose 在本地没有这个镜像的时候会**转去构建而不是
    # pull** —— 在 NAS 上这意味着突然开始拉 node:22-trixie-slim 和 python:3.11-slim
    # 两个基底镜像、然后跑一次几分钟的构建，产物还顶着 ghcr.io/... 的名字，让人以为
    # 自己跑的是发布版。部署机永远只该 pull；要本地构建的是开发机，用
    # deploy/compose.local.yml 那个 overlay（它带 build）。
    container_name: photo-ar-server
    restart: unless-stopped
    # 识别是 CPU 密集的（ORB + RANSAC，XFeat 还多一次 ONNX 推理）。N5095 只有 4 核，
    # 留一核给 cloudflared / CloudDrive2 / QTS 自己，不然扫描时整台 NAS 都发木。
    # xfeat.py 的 `_default_threads()` 会读 cgroup 的 cpu.max 拿到这个 3，
    # 按它设 ORT 的线程数 —— 所以改这个值会真的改变推理的并行度。
    cpus: "3.0"
    mem_limit: 3g
    # 核显透进容器，转码走 h264_vaapi 而不是软编。没挂或节点不存在都不会报错，
    # 服务自己回退 libx264 —— 想确认硬编真生效见 docs/deploy.md 第 4 步。
    devices:
      - /dev/dri:/dev/dri
    # QTS 上 /dev/dri/renderD128 通常属 root:root 且 0666。若容器内打不开设备，
    # 用 `stat -c '%g' /dev/dri/renderD128` 查到 GID 填进来。
    # group_add:
    #   - "44"
    ports:
      # 只监听 LAN/Tailscale。外网走已有的 cloudflared，不在这里暴露。
      #
      # **只有这一个端口。** 容器里其实有两个进程（Node 在前发页面/反代、Python 在后
      # 跑识别与 API），但后者绑在容器内的 127.0.0.1:8965 上，不 EXPOSE 也打不到 ——
      # 拓扑与理由见 docker/entrypoint.py 的模块 docstring。
      - "${PHOTOAR_PORT:-8964}:8964"
    environment:
      # ---- 必填 ----
      #
      # 白名单根目录，**容器内**的路径。服务只允许访问这些目录以下的文件。
      # 两种写法：`名字=路径,名字=路径`（名字会显示在 App 的目录浏览器里），
      # 或者纯路径逗号列表（自动拿目录名当名字）。
      # 必须与下面 volumes 里的挂载点一致 —— 冒号两边写成一样就不用换算。
      PHOTOAR_ROOTS: ${PHOTOAR_ROOTS:-照片=/share/Photo,视频=/share/Video,网盘=/share/CloudDrive}

      # ---- 目录 ----
      #
      # 索引、SQLite、.imgdb、缩略图、转码产物。必须是持久卷。
      PHOTOAR_DATA: /data
      # 模型与词表（xfeat.onnx / vocab.npz / vocab_xfeat.npz）。默认在 /data/models
      # 下面，单独一个变量是为了它能挂成几个部署共享的卷。
      PHOTOAR_MODELS: /data/models
      # /v1/upload 的落地目录。必须在 PHOTOAR_ROOTS 之内，且那条挂载要可写。
      # 不设则上传整体关闭（503）—— 正常用法是关联 NAS 上已有的文件。
      PHOTOAR_UPLOAD_DIR: ${PHOTOAR_UPLOAD_DIR:-/share/Photo/_arphoto_inbox}

      # ---- 识别 ----
      #
      # orb 或 xfeat。⚠️ 只作为**初始值**写进库，之后以管理台里的设置为准 ——
      # 否则在管理台改完、重启一次容器就被这里改回去了（见 Server._seed_backend）。
      PHOTOAR_BACKEND: ${PHOTOAR_BACKEND:-orb}
      # XFeat 的 onnx 从哪儿来。**正常情况下留空**：模型已打进镜像（4.3MB），启动时
      # 从镜像内拷进 /data/models 并过 sha256 校验，全程不需要外网。只有想换一份
      # 自己托管的模型时才填（sha256 不一致会被拒，见 tools/fetch_models.py）。
      PHOTOAR_MODEL_URL: ${PHOTOAR_MODEL_URL:-}
      # 设 0 = 启动时完全不安装模型（模型是手工放进卷里维护的那种部署才需要）。
      PHOTOAR_FETCH_MODELS: ${PHOTOAR_FETCH_MODELS:-1}

      # ---- 身份 ----
      #
      # 运维凭证，给**机器**用（tools/batch_ingest.py）。**可以留空**：人走 /admin
      # 各自一个账号登录，鉴权不依赖它（留空时那条 legacy 分支整体禁用，不是"谁都
      # 通过"）。留空的唯一代价是批量入库脚本用不了。生成：openssl rand -hex 24
      PHOTOAR_TOKEN: ${PHOTOAR_TOKEN:-}
      # 引导管理员。库里一个 admin 都没有时（= 第一次启动）按这两个值建一个。
      # **口令留空 = 初始口令是 `admin`**（源码里的公开默认值）。管理台会强制先改掉它
      # 才让进，但在你改掉之前等于没有口令 —— 公网部署建议在 .env 里直接填一个。
      PHOTOAR_ADMIN_NAME: ${PHOTOAR_ADMIN_NAME:-admin}
      PHOTOAR_ADMIN_PASSWORD: ${PHOTOAR_ADMIN_PASSWORD:-}
      # 上面那条 ports 是 LAN 直连（http），所以默认 0。全程 https 才设 1，
      # 理由见 .env.example。
      PHOTOAR_COOKIE_SECURE: ${PHOTOAR_COOKIE_SECURE:-0}

      # ---- 转码 ----
      #
      # auto = 探测到核显就 h264_vaapi，否则**静默**回退 libx264。确认硬编真生效之后
      # 改成 h264_vaapi，那样核显哪天不可用会直接报错而不是悄悄软编（软编在 N5095 上
      # 慢一个量级，会撞上隧道的 125 秒超时）。见 docs/deploy.md 第 4 步。
      PHOTOAR_VIDEO_ENCODER: ${PHOTOAR_VIDEO_ENCODER:-auto}

      # ---- 网页版 ----
      #
      # 设 0 = 只起后端（管理台与 /v1 照常，`/` 变 404）。这是**出事时的退路**：
      # 网页那一半有问题时改这一个变量就回到已知状态，不用回滚镜像。
      PHOTOAR_WEB: ${PHOTOAR_WEB:-1}
      # 后端在容器内部监听的端口。不对外、也没必要改 —— 除非它跟别的什么撞了。
      # PHOTOAR_INTERNAL_PORT: 8965
      #
      # 跨源隔离（COOP/COEP）。设 0 只在排查「opencv.js 加载不了」时用：require-corp
      # 会拦掉任何缺 CORP 头的跨源资源，而浏览器控制台那条报错不会说是它拦的。
      # 现在这份 opencv.js 是单线程构建，开着其实什么也没换来（见 web-front 里那段注释）。
      WEBFRONT_ISOLATION: ${WEBFRONT_ISOLATION:-1}
      #
      # 让本进程**自己说 https**。生产形态是前面挂隧道（那边自带证书），这两个是给
      # 「手机在局域网 / Tailscale 里自测」用的 —— 那时候手机前面没有隧道那一层，
      # 而 http 下相机根本不存在。两个必须同时给，只给一个进程会直接退出。
      # 路径是**容器内**的（证书目录由下面 WEBFRONT_CERT_DIR 挂到 /certs）。
      # 证书从哪来见 web-front/tools/gen-dev-cert.sh 顶部（优先 tailscale cert 的真证书）。
      WEBFRONT_TLS_CERT: ${WEBFRONT_TLS_CERT:-}
      WEBFRONT_TLS_KEY: ${WEBFRONT_TLS_KEY:-}

      # 监听地址。0.0.0.0 = 容器内全部接口（对外仍然只有上面 ports 那一条）。
      # ⚠️ 起了网页版时这个值**会被 entrypoint 覆盖成 127.0.0.1** —— 后端必须待在
      # 回环上，否则同一个 docker 网络里的别人能绕过前面那层直接打 /v1。
      PHOTOAR_BIND: 0.0.0.0
      # 词汇树用 UTF-8 路径，容器里 locale 默认是 POSIX，显式设一下省事
      LANG: C.UTF-8
    volumes:
      # 索引、SQLite、转码产物、缩略图、模型与词表。必须是持久卷 ——
      # 丢了要全库重新入库（每张约 5s，一万张十几小时）。
      - ./data:/data
      # 可选：放了 deploy/config.json 就会用它代替环境变量（见文件头的说明）。
      # 目录不存在时 compose 会自动建一个空目录，里面没有 config.json，
      # entrypoint 于是走环境变量 —— 所以这条挂载留着是无害的。
      - ./deploy:/config:ro
      # arcoreimg：ARCore SDK 里的闭源二进制，不可再分发，所以镜像里没有它，
      # 由宿主机送进去（记得 chmod +x）。本地构建的镜像里已经有一份，这条挂载
      # 只是覆盖成同一个文件，无害。
      - ./tools/arcoreimg:/opt/photoar/tools/arcoreimg:ro
      # 照片与视频。只读挂载：这个服务永远不改用户的原始文件
      # （唯一的写入是 /v1/upload，落在下面单独一条可写挂载里）。
      - /share/Photo:/share/Photo:ro
      - /share/Video:/share/Video:ro
      # CloudDrive2 把网盘挂成了普通路径，一并挂进来就能直接关联网盘里的视频
      - /share/CloudDrive:/share/CloudDrive:ro
      # /v1/upload 的落地目录，是整份配置里唯一可写的用户目录
      - /share/Photo/_arphoto_inbox:/share/Photo/_arphoto_inbox
      # 自测用的证书目录，只读。不用 TLS 时挂个空目录也无害；要用的话
      # WEBFRONT_TLS_CERT/KEY 里的路径必须写成 /certs/xxx（容器内的路径）。
      - ${WEBFRONT_CERT_DIR:-./web-front/local}:/certs:ro
    healthcheck:
      # 与 Dockerfile 里的 HEALTHCHECK 同一个脚本，不再抄一份 `python -c`
      # （抄两份迟早分叉）。没配 token 时它把 401 也算健康 —— 理由写在那个文件里。
      test: ["CMD", "python", "/opt/photoar/docker/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
